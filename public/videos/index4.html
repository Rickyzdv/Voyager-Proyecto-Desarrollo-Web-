<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video & Audio</title>
    <style>
      video {
        width: 500px;
        height: 500px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <video controls autoplay loop src="/videos/ocean.mp4">
      Your browser doesn't support videos
    </video>
    <audio src=""></audio>
    <!-- Audio tag, which functions the same as the video ones -->
  </body>
</html>
